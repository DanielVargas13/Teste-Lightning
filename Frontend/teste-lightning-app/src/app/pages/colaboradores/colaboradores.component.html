<div class="min-h-screen bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">👥 Colaboradores</h1>
      <button
        (click)="abrirFormulario()"
        class="inline-flex items-center px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition"
      >
        + Novo Colaborador
      </button>
    </div>

    <div *ngIf="mostrarFormulario" class="mb-8">
      <app-formulario-colaborador
        [colaborador]="colaboradorSelecionado"
        (salvo)="atualizarLista()"
        (cancelado)="fecharFormulario()"
      ></app-formulario-colaborador>
    </div>

    <div>
      <app-lista-colaboradores
        (editar)="editarColaborador($event)"
        (listaAtualizada)="atualizarLista()"
      ></app-lista-colaboradores>
    </div>
  </div>
</div>
