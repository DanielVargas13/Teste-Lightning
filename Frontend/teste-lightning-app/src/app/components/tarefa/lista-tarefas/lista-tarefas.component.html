<div class="bg-white rounded-lg shadow">
  <div *ngIf="carregando" class="p-8 text-center">
    <p class="text-gray-500">Carregando tarefas...</p>
  </div>

  <div *ngIf="erro" class="p-4 bg-red-100 border border-red-400 text-red-700 rounded">
    {{ erro }}
  </div>

  <div *ngIf="!(carregando || erro)" class="overflow-x-auto">
    <table class="min-w-full">
      <thead class="bg-gray-100 border-b">
        <tr>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Descrição</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Colaborador</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Periodicidade</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Data Agendada</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Status</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Ações</th>
        </tr>
      </thead>
      <tbody class="divide-y">
        <tr
          *ngFor="let tarefa of tarefas$ | async"
          class="hover:bg-gray-50 transition"
        >
          <td class="px-6 py-4 text-sm text-gray-900 max-w-xs truncate">
            {{ tarefa.descricao }}
          </td>
          <td class="px-6 py-4 text-sm text-gray-900">{{ tarefa.nomeColaborador }}</td>
          <td class="px-6 py-4 text-sm text-gray-600">{{ tarefa.periodicidadeDias }} dias</td>
          <td class="px-6 py-4 text-sm text-gray-600">{{ formatarData(tarefa.dataAgendada) }}</td>
          <td class="px-6 py-4 text-sm">
            <span
              *ngIf="tarefa.ativo"
              class="inline-flex px-3 py-1 text-sm font-semibold text-green-800 bg-green-100 rounded-full"
            >
              Ativa
            </span>
            <span
              *ngIf="!tarefa.ativo"
              class="inline-flex px-3 py-1 text-sm font-semibold text-red-800 bg-red-100 rounded-full"
            >
              Inativa
            </span>
          </td>
          <td class="px-6 py-4 text-sm space-y-2">
            <div class="flex gap-2 flex-wrap">
              <button
                (click)="executarTarefa(tarefa.id)"
                class="px-3 py-1 bg-green-100 text-green-700 rounded hover:bg-green-200 transition text-xs"
              >
                ▶ Executar
              </button>
              <button
                (click)="editarTarefa(tarefa)"
                class="px-3 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition text-xs"
              >
                ✏️ Editar
              </button>
              <button
                (click)="deletarTarefa(tarefa.id)"
                class="px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 transition text-xs"
              >
                🗑️ Deletar
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div
      *ngIf="(tarefas$ | async)?.length === 0"
      class="p-8 text-center text-gray-500"
    >
      Nenhuma tarefa encontrada
    </div>
  </div>
</div>
