<div class="bg-white rounded-lg shadow">
  <div *ngIf="carregando" class="p-8 text-center">
    <p class="text-gray-500">Carregando colaboradores...</p>
  </div>

  <div *ngIf="erro" class="p-4 bg-red-100 border border-red-400 text-red-700 rounded">
    {{ erro }}
  </div>

  <div *ngIf="!(carregando || erro)" class="overflow-x-auto">
    <table class="min-w-full">
      <thead class="bg-gray-100 border-b">
        <tr>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Nome</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Sobrenome</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Celular</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Endereço</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Status</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Ações</th>
        </tr>
      </thead>
      <tbody class="divide-y">
        <tr
          *ngFor="let colaborador of colaboradores$ | async"
          class="hover:bg-gray-50 transition"
        >
          <td class="px-6 py-4 text-sm text-gray-900">{{ colaborador.nome }}</td>
          <td class="px-6 py-4 text-sm text-gray-900">{{ colaborador.sobrenome }}</td>
          <td class="px-6 py-4 text-sm text-gray-600">{{ colaborador.celular }}</td>
          <td class="px-6 py-4 text-sm text-gray-600">{{ colaborador.endereco }}</td>
          <td class="px-6 py-4 text-sm">
            <span
              *ngIf="colaborador.ativo"
              class="inline-flex px-3 py-1 text-sm font-semibold text-green-800 bg-green-100 rounded-full"
            >
              Ativo
            </span>
            <span
              *ngIf="!colaborador.ativo"
              class="inline-flex px-3 py-1 text-sm font-semibold text-red-800 bg-red-100 rounded-full"
            >
              Inativo
            </span>
          </td>
          <td class="px-6 py-4 text-sm">
            <button
              (click)="editarColaborador(colaborador)"
              class="mr-3 px-3 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition"
            >
              Editar
            </button>
            <button
              (click)="deletarColaborador(colaborador.id)"
              class="px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 transition"
            >
              Deletar
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div
      *ngIf="(colaboradores$ | async)?.length === 0"
      class="p-8 text-center text-gray-500"
    >
      Nenhum colaborador encontrado
    </div>
  </div>
</div>
