<div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
  <div class="flex items-center justify-between">
    <!-- Status Status -->
    <div class="flex items-center gap-3">
      <div *ngIf="sincronizando$ | async as sincronizando" class="flex items-center gap-2">
        <div
          *ngIf="sincronizando"
          class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"
        ></div>
        <div *ngIf="!sincronizando" class="w-3 h-3 bg-green-500 rounded-full"></div>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-900">
          {{ (sincronizando$ | async) ? 'Sincronizando...' : 'Sincronizado' }}
        </p>
        <p class="text-xs text-gray-600">
          Última: {{ formatarData(ultimaSincronizacao$ | async) }}
        </p>
      </div>
    </div>

    <!-- Estatísticas -->
    <div *ngIf="statusGeral$ | async as status" class="flex items-center gap-6">
      <div class="text-center">
        <p class="text-sm font-medium text-gray-900">{{ status.sucesso }}</p>
        <p class="text-xs text-green-600">Sincronizadas</p>
      </div>
      <div class="text-center">
        <p class="text-sm font-medium text-gray-900">{{ status.pendentes }}</p>
        <p class="text-xs text-blue-600">Pendentes</p>
      </div>
      <div class="text-center">
        <p class="text-sm font-medium text-gray-900">{{ status.erros }}</p>
        <p class="text-xs text-red-600">Erros</p>
      </div>
    </div>

    <!-- Botões -->
    <button
      (click)="sincronizarAgora()"
      [disabled]="sincronizando$ | async"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition text-sm font-medium"
    >
      {{ (sincronizando$ | async) ? '⏳ Sincronizando' : '🔄 Sincronizar Agora' }}
    </button>
  </div>
</div>
